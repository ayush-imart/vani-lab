services:
  - type: web
    name: vani-lab-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUDITOR
        value: eve
      - key: AUTOSCALE_TICK_MS
        value: 0
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: API_SHARED_SECRET
        sync: false
      - key: EVE_HOST
        value: http://127.0.0.1:2000
      - key: SARVAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SARVAM_VOICE_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID_A
        sync: false
      - key: SARVAM_APP_ID_B
        sync: false
      - key: SARVAM_APP_ID_C
        sync: false
